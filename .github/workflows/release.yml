name: Release to PyPI

# Builds and checks the distribution on every published release. Publishing uses
# PyPI Trusted Publishing (OIDC), so no API token is stored anywhere, and runs
# only when the repository variable PYPI_TRUSTED_PUBLISHING is "true".
# One-time setup (account owner): on pypi.org, project veripipe -> Publishing,
# add a GitHub publisher (owner zhangyy0423, repository veripipe, workflow
# release.yml, environment pypi); then set the variable:
#   gh variable set PYPI_TRUSTED_PUBLISHING --body true -R zhangyy0423/veripipe
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python3 -m pip install --disable-pip-version-check "build==1.2.2.post1"
          python3 -m build

      # Fail before publishing if the wheel does not install or the release tag
      # does not match the packaged version.
      - name: Check the built wheel
        run: |
          python3 -m pip install --disable-pip-version-check dist/*.whl
          python3 -c "import pipeline_v2, pipeline_v2_mcp"
          if [ "${{ github.event_name }}" = "release" ]; then
            test "v$(cat VERSION)" = "${{ github.event.release.tag_name }}"
          fi

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    if: vars.PYPI_TRUSTED_PUBLISHING == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@v1.12.4
