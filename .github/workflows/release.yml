name: Release to PyPI

# Publishes with PyPI Trusted Publishing (OIDC): no API token is stored anywhere.
# One-time setup on pypi.org (account owner): add a pending publisher for project
# "veripipe" -> owner zhangyy0423, repository veripipe, workflow release.yml,
# environment pypi. Until that exists, the publish job fails and nothing is uploaded.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          python3 -m pip install --disable-pip-version-check "build==1.2.2.post1"
          python3 -m build

      # Fail before publishing if the wheel does not install or the release tag
      # does not match the packaged version.
      - name: Check the built wheel
        run: |
          python3 -m pip install --disable-pip-version-check dist/*.whl
          python3 -c "import pipeline_v2, pipeline_v2_mcp"
          if [ "${{ github.event_name }}" = "release" ]; then
            test "v$(cat VERSION)" = "${{ github.event.release.tag_name }}"
          fi

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@v1.12.4
