name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: gates (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show toolchain
        run: |
          python3 --version
          bash --version | head -n1

      # Install the package so its single runtime dependency (PyYAML) is present.
      # PyYAML is required to load semantic/code maps in the contract gate's
      # dry-run and in the knowledge-audit unit tests. The optional `live`
      # extra (websocket-client) is intentionally NOT installed: the gate suite
      # runs fully offline and never opens a live product transport.
      - name: Install package (pulls PyYAML)
        run: python3 -m pip install --disable-pip-version-check .

      # After install the gate suite runs offline: bash-syntax, python-syntax,
      # secret-scan, contract (Playwright dry-run + MCP smoke + product-neutrality)
      # and unit (installer + engine + MCP). No network access is used by the gates.
      - name: Run CI gates
        run: bash scripts/ci/run-gates.sh
