[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "veripipe"
description = "Anti-false-positive verification pipeline for AI agents testing web/HTTP products"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = [
    "ai-agents",
    "verification",
    "testing",
    "oracle",
    "playwright",
    "mcp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]
dynamic = ["version"]
# The core loads YAML semantic/code maps, so PyYAML is the single required
# runtime dependency. The MCP server (pipeline_v2_mcp) stays standard-library
# only and imports nothing from here that pulls PyYAML at import time.
dependencies = ["PyYAML>=6,<7"]

[project.optional-dependencies]
# Live product transport over WebSocket is only needed for real runs; the
# offline gate suite and dry-runs never import it. Kept out of the core deps
# so `pip install veripipe` stays lean.
live = ["websocket-client>=1,<2"]

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools]
package-dir = { "" = "shared-skills/pipeline-v2/scripts" }

[tool.setuptools.packages.find]
where = ["shared-skills/pipeline-v2/scripts"]

[tool.setuptools.package-data]
pipeline_v2 = ["py.typed"]
